name: skillcheck
version: 0.2.0
description: "CI for agent skills: snapshot every skill write, generate regression cases, re-run them against the candidate revision in narrowed child sessions, and report pass/fail diffs before you trust the change. Manual promote/revert - no automatic destructive writes."
author: "Shridhar Kumar"
requires_hermes: ">=0.22.0"
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - on_skill_lifecycle
provides_tools:
  - skillcheck_status
  - skillcheck_generate
  - skillcheck_cases
  - skillcheck_run
  - skillcheck_promote
  - skillcheck_revert
tags: [evals, regression, testing, skills, reliability]
